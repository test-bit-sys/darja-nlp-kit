<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#0b101d" />
      <stop offset="100%" stop-color="#05070c" />
    </radialGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#ef4444" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.7" />
    </linearGradient>

    <!-- Emerald Primary Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Crimson Algerian Red Gradient -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Platinum Crisp White Gradient -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="emeraldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="redGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Container Squircle Background -->
  <rect x="20" y="20" width="984" height="984" rx="220" fill="url(#bgGradient)" />
  <rect x="20" y="20" width="984" height="984" rx="220" fill="none" stroke="url(#borderGlow)" stroke-width="3.5" />

  <!-- Subtle Ambient Circuit & Soundwave Ring in Background -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1.5">
    <circle cx="512" cy="415" r="160" fill="none" stroke-dasharray="6,8" />
    <circle cx="512" cy="415" r="250" fill="none" stroke-dasharray="4,12" />
    <circle cx="512" cy="415" r="340" fill="none" stroke-dasharray="10,16" />
    <line x1="160" y1="415" x2="864" y2="415" stroke-dasharray="8,8" />
  </g>

  <!-- Soft Colored Ambient Backlights -->
  <circle cx="460" cy="415" r="190" fill="#10b981" opacity="0.16" filter="url(#emeraldGlow)" />
  <circle cx="560" cy="415" r="110" fill="#ef4444" opacity="0.22" filter="url(#redGlow)" />

  <!-- ======================================================== -->
  <!-- CENTRAL EMBLEM: Speech Bubble + Algerian Crescent & Star -->
  <!-- ======================================================== -->
  <g filter="url(#shadowFilter)">
    <!-- Outer Rounded Conversational AI Bubble Frame -->
    <!-- Elegantly styled squircle bubble with bottom-left speech pointer tail -->
    <path d="M 330 230
             L 694 230
             A 180 180 0 0 1 874 410
             L 874 430
             A 180 180 0 0 1 694 610
             L 370 610
             L 240 680
             L 270 560
             A 180 180 0 0 1 150 410
             L 150 410
             A 180 180 0 0 1 330 230
             Z"
          fill="#0c1322"
          stroke="url(#emeraldGrad)"
          stroke-width="26"
          stroke-linejoin="round" />

    <!-- Elegant Calligraphic Arabic 'Dal' (د) Sweep inside the Bubble (Left to Bottom) -->
    <path d="M 640 270
             C 410 270, 240 340, 240 450
             C 240 520, 290 565, 380 565
             C 500 565, 680 545, 780 510"
          fill="none"
          stroke="url(#emeraldGrad)"
          stroke-width="22"
          stroke-linecap="round"
          opacity="0.4" />

    <!-- Algerian Crescent Moon (Brilliant Platinum White) -->
    <!-- Outer Arc radius 112, Inner Arc radius 90 -->
    <path d="M 490 305
             A 112 112 0 1 0 490 525
             A 90 90 0 1 1 490 305
             Z"
          fill="url(#whiteGrad)" />

    <!-- Radiant Algerian Crimson 5-Point Star -->
    <polygon points="555.0,369.0 566.2,399.6 598.7,400.8 573.1,420.9 582.0,452.2 555.0,434.0 528.0,452.2 536.9,420.9 511.3,400.8 543.8,399.6"
             fill="url(#crimsonGrad)"
             filter="url(#redGlow)" />

    <!-- Neural NLP Soundwave Bars (Right Side of Bubble) -->
    <!-- Visualizing voice recognition and tokenization in Darja -->
    <g transform="translate(680, 345)">
      <!-- Wave 1 -->
      <rect x="0" y="45" width="14" height="50" rx="7" fill="url(#cyanGrad)" />
      <!-- Wave 2 -->
      <rect x="24" y="25" width="14" height="90" rx="7" fill="url(#emeraldGrad)" />
      <!-- Wave 3 (Tallest Peak) -->
      <rect x="48" y="5" width="14" height="130" rx="7" fill="#34d399" filter="url(#emeraldGlow)" />
      <!-- Wave 4 -->
      <rect x="72" y="25" width="14" height="90" rx="7" fill="url(#cyanGrad)" />
      <!-- Wave 5 -->
      <rect x="96" y="45" width="14" height="50" rx="7" fill="url(#emeraldGrad)" />
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- TYPOGRAPHY SECTION: Modern, Bold & Authoritative          -->
  <!-- ======================================================== -->
  <g transform="translate(0, 745)">
    <!-- Main Project Brand Name -->
    <text x="512" y="70"
          text-anchor="middle"
          font-family="'Cairo', 'Inter', -apple-system, sans-serif"
          font-weight="900"
          font-size="84"
          letter-spacing="2">
      <tspan fill="#10b981">darja</tspan><tspan fill="#475569">·</tspan><tspan fill="#f8fafc">nlp</tspan><tspan fill="#475569">·</tspan><tspan fill="#38bdf8">kit</tspan>
    </text>

    <!-- Subtitle Pill Badge -->
    <g transform="translate(252, 110)">
      <rect x="0" y="0" width="520" height="50" rx="25" fill="#0b1220" stroke="#1e293b" stroke-width="2" />
      
      <!-- Mini Algerian Flag Indicators -->
      <circle cx="36" cy="25" r="9" fill="#10b981" />
      <circle cx="58" cy="25" r="9" fill="#f8fafc" />
      <circle cx="80" cy="25" r="9" fill="#ef4444" />

      <!-- Tagline Text -->
      <text x="306" y="32"
            text-anchor="middle"
            font-family="'JetBrains Mono', 'Cairo', sans-serif"
            font-weight="700"
            font-size="19"
            fill="#94a3b8"
            letter-spacing="3.5">
        ALGERIAN AI &amp; NLP ENGINE
      </text>
    </g>
  </g>
</svg>

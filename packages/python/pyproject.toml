[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "darja-nlp-kit"
version = "1.0.0"
description = "Zero-dependency NLP toolkit for Algerian Darja (Arabic/French/Arabizi code-switching)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "DZ Open Suite"}
]
keywords = [
    "nlp", "arabic", "darja", "algerian", "arabizi",
    "sentiment", "tokenizer", "stopwords", "code-switching"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Natural Language :: Arabic",
]

[project.urls]
Homepage = "https://github.com/test-bit-sys/darja-nlp-kit"
Repository = "https://github.com/test-bit-sys/darja-nlp-kit"
Issues = "https://github.com/test-bit-sys/darja-nlp-kit/issues"

[project.scripts]
darja-nlp = "darja_nlp.cli:main"

[tool.setuptools.packages.find]
include = ["darja_nlp*"]

[tool.setuptools.package-data]
darja_nlp = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
